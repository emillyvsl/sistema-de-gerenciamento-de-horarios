{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4" style="width: 100%; max-width: 400px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);">
        <h3 class="text-center mb-4">Alocar Disciplina</h3>
        
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="ano_semestre_id" value="{{ ano_semestre_id }}">

            <div class="form-group">
                <label for="disciplina">Disciplina:</label>
                <select id="disciplina" name="disciplina" class="form-control" required>
                    <option value="" disabled selected>Selecione a Disciplina</option>
                    {% for disciplina in disciplinas %}
                        <option value="{{ disciplina.id }}">
                            {{ disciplina.nome }}
                            {% for professor in disciplina.disciplina_professores.all %}
                                {% if forloop.first %} - Professor(es): {% endif %}
                                {{ professor.professor.nome }}{% if not forloop.last %}, {% endif %}
                            {% endfor %}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-block mt-3">Alocar</button>
        </form>
    </div>
</div>

<style>
    .container {
        max-width: 100%;
    }
    .card {
        border: 1px solid #ddd;
        border-radius: 8px;
    }
    .btn-primary {
        background-color: #007bff;
        border: none;
    }
</style>
{% endblock %}
